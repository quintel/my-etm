name: CI checks

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      # No bundler-cache — Brakeman's static analysis needs no app gems or bundle install.
      - name: Scan for common Rails security vulnerabilities using static analysis
        run: |
          gem install brakeman
          brakeman --no-pager

  scan_js:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  ruby_version:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check the Dockerfiles use the Ruby in .ruby-version
        run: |
          v=$(cat .ruby-version)
          for f in Dockerfile Dockerfile.production; do
            grep -qE "ruby:${v}-slim|RUBY_VERSION=${v}-slim" "$f" || { echo "$f is not on Ruby $v"; exit 1; }
          done
