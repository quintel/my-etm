openapi: 3.1.0
info:
  title: MyETM API v2
  version: "1.0"
  description: >
    The source of truth for the Api::V2 response contract. Client can validate their requests and
    responses against this document, generate a typed client or a mock server from it, and CI fails
    any endpoint whose live response drifts from what is declared here
    (see spec/support/matchers/v2_envelope_matcher.rb).

    The five response kinds (Resource, Collection, Batch, Accepted, Error) are the closed set every
    Api::V2::Responses render_* helper produces. Per-resource schemas (SavedScenarioUserBatch) narrow
    a kind for one endpoint's own spec.
    204 No Content is envelope-exempt and carries no body. paths not yet populated.

    OpenAPI spec reference: https://spec.openapis.org/oas/v3.1.0
paths: {}
components:
  schemas:
    ErrorObject:
      type: object
      required: [status, code, detail]
      properties:
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        source:
          type: [object, "null"]
      additionalProperties: false

    Resource:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
        meta:
          type: object
      additionalProperties: false

    Collection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
      additionalProperties: false

    BatchItemError:
      type: object
      required: [status, code, detail, source]
      properties:
        status:
          const: error
        code:
          type: string
        detail:
          type: string
        source:
          type: object
          required: [pointer]
          properties:
            pointer:
              type: string
              pattern: "^/"
          additionalProperties: false
      additionalProperties: false

    BatchItemOk:
      type: object
      required: [status]
      properties:
        status:
          const: ok
      additionalProperties: true

    BatchItem:
      oneOf:
        - $ref: "#/components/schemas/BatchItemOk"
        - $ref: "#/components/schemas/BatchItemError"

    SavedScenarioUserItemOk:
      type: object
      required: [status, id, user_id, user_email, role]
      properties:
        status:
          const: ok
        id:
          type: integer
        user_id:
          type: [integer, "null"]
        user_email:
          type: [string, "null"]
        role:
          type: string
      additionalProperties: false

    SavedScenarioUserBatch:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SavedScenarioUserItemOk"
              - $ref: "#/components/schemas/BatchItemError"
        meta:
          type: object
          required: [batch]
          properties:
            batch:
              $ref: "#/components/schemas/BatchMeta"
      additionalProperties: false

    BatchMeta:
      type: object
      required: [succeeded, failed, total]
      properties:
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
      additionalProperties: false

    Batch:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BatchItem"
        meta:
          type: object
          required: [batch]
          properties:
            batch:
              $ref: "#/components/schemas/BatchMeta"
      additionalProperties: false

    Accepted:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              const: accepted
        meta:
          type: object
      additionalProperties: false

    Error:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ErrorObject"
      additionalProperties: false
