# Staff applications – local devlopment
etmodel:
  uri: http://localhost:3001
etengine:
  uri: http://localhost:3000
collections:
  uri: http://localhost:3005

myetm:
  iss: my-etm
  uri: <%= ENV.fetch('OPENID_ISSUER', 'http://localhost:3002') %>

mailchimp:
  newsletter:
    list_url: <%= ENV.fetch('MAILCHIMP_LIST_URL', nil) %>
    api_key: <%= ENV.fetch('MAILCHIMP_API_KEY', nil) %>
  changelog:
    list_url: <%= ENV.fetch('MAILCHIMP_LIST_CHANGELOG_URL', nil) %>
    api_key: <%= ENV.fetch('MAILCHIMP_API_KEY', nil) %>

recaptcha:
  site_key:  <%= ENV.fetch('RECAPTCHA_SITE_KEY', nil) %>
  secret_key: <%= ENV.fetch('RECAPTCHA_SECRET_KEY', nil) %>

# set to true if the server won't have online access. this disables Sentry,
# etc.
standalone: false

mailer:
  # E-mail address from which to send e-mails.
  from: "Energy Transition Model <info@energytransitionmodel.com>"

auth:
  issuer: <%= ENV.fetch('OPENID_ISSUER', 'http://localhost:3002') %>
  # Parent domain the shared "etm_session" JWT session cookie is scoped to. Must be a domain
  # shared by all ETM apps so they can read it. Defaults to production; override via
  # SSO_COOKIE_DOMAIN for ETLauncher or separate-app dev (e.g. etm.test via /etc/hosts).
  sso_cookie_domain: <%= ENV.fetch('SSO_COOKIE_DOMAIN', '.energytransitionmodel.com') %>
  # Appended to the session cookie names, so deployments sharing a cookie domain don't share the
  # session. Beta and production are both under energytransitionmodel.com with no common parent
  # below it, so beta sets "_beta" and would otherwise sign production out in the same browser.
  # Every consuming app must be given the same SSO_COOKIE_SUFFIX.
  sso_cookie_suffix: <%= ENV.fetch('SSO_COOKIE_SUFFIX', '') %>

# Optionally send error messages to the Sentry service by providing your
# Sentry DSN:
sentry_dsn: <%= ENV['SENTRY_DSN'] %>
release: '2026-07'
